<!DOCTYPE html>
<html>
<head>
<title>Documents</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<style>

body{
    font-family:'Poppins', sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
}

/* CONTAINER */
.container{
    padding:40px;
}

/* TITLE */
h1{
    margin-bottom:20px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

/* CARD */
.card{
    padding:20px;
    border-radius:15px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 15px #7c3aed;
}

/* TEXT */
.title{
    font-weight:bold;
}

.summary{
    opacity:0.7;
    font-size:14px;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>📄 Your Documents</h1>

<div class="grid">

{% for doc in documents %}
<div class="card">
    <div class="title">{{ doc.title }}</div>
    <div class="summary">{{ doc.summary|truncatewords:25 }}</div>
</div>
{% endfor %}

</div>

</div>

</body>
</html>
