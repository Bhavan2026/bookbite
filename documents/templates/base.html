<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Document Processing System{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root{
            --primary:#2563eb;
            --primary-dark:#1d4ed8;
            --secondary:#7c3aed;
            --bg:#f4f7fb;
            --surface:#ffffff;
            --surface-soft:rgba(255,255,255,0.86);
            --text:#111827;
            --muted:#6b7280;
            --line:#e5e7eb;
            --success:#16a34a;
            --danger:#ef4444;
            --shadow:0 20px 45px rgba(37,99,235,0.10);
            --shadow-soft:0 10px 25px rgba(15,23,42,0.07);
            --radius-xl:28px;
            --radius-lg:22px;
            --radius-md:16px;
            --radius-sm:12px;
            --gradient:linear-gradient(135deg,#2563eb 0%,#4f46e5 55%,#7c3aed 100%);
            --page-gradient:
                radial-gradient(circle at top left, rgba(37,99,235,0.10), transparent 28%),
                radial-gradient(circle at top right, rgba(124,58,237,0.12), transparent 24%),
                linear-gradient(135deg,#eef4ff 0%,#f9fbff 45%,#f5f3ff 100%);
        }

        *{box-sizing:border-box;}
        html,body{
            margin:0;
            padding:0;
            font-family:'Inter',sans-serif;
            background:var(--bg);
            color:var(--text);
        }

        body{
            min-height:100vh;
            background:var(--page-gradient);
        }

        a{
            text-decoration:none;
            color:inherit;
        }

        img{
            max-width:100%;
        }

        .container{
            width:min(1200px, calc(100% - 32px));
            margin:0 auto;
        }

        .page-shell{
            min-height:100vh;
            padding:24px 0 40px;
        }

        .glass-card{
            background:var(--surface-soft);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,0.75);
            box-shadow:var(--shadow);
            border-radius:var(--radius-xl);
        }

        .btn{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            padding:14px 18px;
            border:none;
            border-radius:16px;
            cursor:pointer;
            font-weight:700;
            transition:0.25s ease;
            font-family:inherit;
        }

        .btn-primary{
            background:var(--gradient);
            color:#fff;
            box-shadow:0 18px 34px rgba(79,70,229,0.20);
        }

        .btn-primary:hover,
        .btn-secondary:hover,
        .btn-ghost:hover{
            transform:translateY(-2px);
        }

        .btn-secondary{
            background:rgba(37,99,235,0.10);
            color:var(--primary);
        }

        .btn-ghost{
            background:#fff;
            color:var(--text);
            border:1px solid var(--line);
        }

        .section-title{
            font-size:1.15rem;
            font-weight:700;
            margin:0 0 18px;
        }

        .muted{
            color:var(--muted);
        }

        .logo{
            display:inline-flex;
            align-items:center;
            gap:12px;
            font-weight:800;
            font-size:1.1rem;
        }

        .logo-mark{
            width:46px;
            height:46px;
            border-radius:16px;
            display:grid;
            place-items:center;
            background:var(--gradient);
            color:#fff;
            box-shadow:0 12px 24px rgba(79,70,229,0.28);
        }

        .auth-layout{
            min-height:calc(100vh - 64px);
            display:grid;
            grid-template-columns:1.05fr 0.95fr;
            gap:28px;
            align-items:center;
        }

        .hero-panel,
        .form-panel{
            padding:38px;
        }

        .hero-panel{
            min-height:760px;
            display:flex;
            flex-direction:column;
            justify-content:space-between;
            position:relative;
            overflow:hidden;
        }

        .hero-panel::after{
            content:"";
            position:absolute;
            right:-60px;
            bottom:-60px;
            width:220px;
            height:220px;
            background:radial-gradient(circle, rgba(37,99,235,0.18), transparent 70%);
            border-radius:50%;
        }

        .hero-copy h1{
            font-size:clamp(2.3rem,4vw,4rem);
            line-height:1.04;
            letter-spacing:-0.03em;
            margin:18px 0 12px;
        }

        .hero-copy p{
            color:var(--muted);
            line-height:1.75;
            max-width:620px;
        }

        .feature-grid{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:16px;
            margin-top:26px;
        }

        .feature-tile{
            background:rgba(255,255,255,0.78);
            border:1px solid rgba(37,99,235,0.08);
            border-radius:20px;
            padding:18px;
            box-shadow:var(--shadow-soft);
        }

        .feature-tile i{
            color:var(--primary);
            margin-bottom:12px;
            font-size:1.1rem;
        }

        .feature-tile h4{
            margin:0 0 6px;
            font-size:1rem;
        }

        .feature-tile p{
            margin:0;
            color:var(--muted);
            font-size:0.93rem;
            line-height:1.6;
        }

        .ai-illustration{
            margin-top:28px;
            padding:24px;
            border-radius:26px;
            background:linear-gradient(145deg, rgba(37,99,235,0.12), rgba(124,58,237,0.12));
            border:1px solid rgba(255,255,255,0.7);
        }

        .illus-grid{
            display:grid;
            grid-template-columns:1.15fr 0.85fr;
            gap:18px;
            align-items:center;
        }

        .illus-screen{
            background:#fff;
            border-radius:22px;
            padding:20px;
            box-shadow:var(--shadow-soft);
        }

        .top-dots{
            display:flex;
            gap:8px;
            margin-bottom:16px;
        }

        .top-dots span{
            width:10px;
            height:10px;
            border-radius:50%;
            background:#d1d5db;
        }

        .top-dots span:nth-child(1){background:#60a5fa;}
        .top-dots span:nth-child(2){background:#a78bfa;}
        .top-dots span:nth-child(3){background:#93c5fd;}

        .fake-lines{
            display:grid;
            gap:12px;
        }

        .fake-lines span{
            display:block;
            height:12px;
            border-radius:999px;
            background:linear-gradient(90deg, rgba(37,99,235,0.14), rgba(124,58,237,0.14));
        }

        .fake-lines span:nth-child(2){width:82%;}
        .fake-lines span:nth-child(3){width:58%;}

        .orb-stack{
            display:grid;
            justify-items:center;
            gap:16px;
        }

        .orb{
            border-radius:50%;
            background:var(--gradient);
            box-shadow:0 18px 34px rgba(79,70,229,0.22);
        }

        .orb.one{width:120px;height:120px;}
        .orb.two{width:82px;height:82px;opacity:0.78;}
        .orb.three{width:54px;height:54px;opacity:0.58;}

        .badge{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:10px 14px;
            border-radius:999px;
            background:rgba(37,99,235,0.10);
            color:var(--primary);
            font-weight:700;
            font-size:0.9rem;
        }

        .form-panel{
            max-width:560px;
            width:100%;
            justify-self:center;
        }

        .form-title{
            margin:18px 0 8px;
            font-size:2rem;
            letter-spacing:-0.02em;
        }

        .form-subtitle{
            margin:0;
            color:var(--muted);
            line-height:1.7;
        }

        .form-grid{
            display:grid;
            gap:16px;
            margin-top:26px;
        }

        .field{
            display:grid;
            gap:9px;
        }

        .field label{
            font-weight:600;
            font-size:0.95rem;
        }

        .input-wrap{
            display:flex;
            align-items:center;
            gap:12px;
            border-radius:16px;
            border:1px solid var(--line);
            background:rgba(255,255,255,0.95);
            padding:0 16px;
            transition:0.25s ease;
            box-shadow:0 4px 12px rgba(15,23,42,0.03);
        }

        .input-wrap:focus-within{
            border-color:rgba(37,99,235,0.45);
            box-shadow:0 0 0 5px rgba(37,99,235,0.08);
            transform:translateY(-1px);
        }

        .input-wrap i{
            color:#94a3b8;
        }

        .input-wrap input,
        .input-wrap select,
        .input-wrap textarea{
            width:100%;
            border:none;
            outline:none;
            background:transparent;
            padding:16px 0;
            font-size:0.98rem;
            color:var(--text);
            font-family:inherit;
        }

        .toggle-btn{
            border:none;
            background:transparent;
            cursor:pointer;
            color:#64748b;
            font-size:0.95rem;
        }

        .inline-row{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:14px;
            flex-wrap:wrap;
        }

        .checkbox-row{
            display:inline-flex;
            align-items:center;
            gap:10px;
            color:var(--muted);
            font-size:0.94rem;
        }

        .checkbox-row input{
            width:18px;
            height:18px;
            accent-color:var(--primary);
        }

        .divider{
            display:flex;
            align-items:center;
            gap:14px;
            color:#94a3b8;
            font-size:0.9rem;
            margin:8px 0;
        }

        .divider::before,
        .divider::after{
            content:"";
            flex:1;
            height:1px;
            background:var(--line);
        }

        .social-grid{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:12px;
        }

        .link-accent{
            color:var(--primary);
            font-weight:700;
        }

        .dashboard-shell{
            display:grid;
            grid-template-columns:290px 1fr;
            min-height:100vh;
        }

        .sidebar{
            padding:24px;
            border-right:1px solid rgba(148,163,184,0.16);
            background:rgba(255,255,255,0.72);
            backdrop-filter:blur(16px);
        }

        .sidebar-menu{
            display:grid;
            gap:10px;
            margin-top:28px;
        }

        .nav-link{
            display:flex;
            align-items:center;
            gap:14px;
            padding:14px 16px;
            border-radius:16px;
            color:#475569;
            font-weight:600;
            transition:0.25s ease;
        }

        .nav-link:hover,
        .nav-link.active{
            background:rgba(37,99,235,0.10);
            color:var(--primary);
            box-shadow:inset 0 0 0 1px rgba(37,99,235,0.08);
        }

        .sidebar-card{
            margin-top:28px;
            padding:20px;
            border-radius:22px;
            background:var(--gradient);
            color:#fff;
            box-shadow:0 18px 32px rgba(79,70,229,0.22);
        }

        .main-content{
            padding:28px;
        }

        .topbar{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:16px;
            flex-wrap:wrap;
            margin-bottom:24px;
        }

        .search-pill{
            flex:1;
            min-width:260px;
            display:flex;
            align-items:center;
            gap:12px;
            padding:14px 18px;
            background:rgba(255,255,255,0.9);
            border:1px solid var(--line);
            border-radius:18px;
            box-shadow:var(--shadow-soft);
        }

        .search-pill input{
            width:100%;
            border:none;
            outline:none;
            background:transparent;
            font-size:0.96rem;
            font-family:inherit;
        }

        .user-chip{
            display:inline-flex;
            align-items:center;
            gap:12px;
            padding:10px 14px;
            border-radius:16px;
            background:rgba(255,255,255,0.9);
            border:1px solid var(--line);
            box-shadow:var(--shadow-soft);
        }

        .avatar{
            width:42px;
            height:42px;
            border-radius:14px;
            display:grid;
            place-items:center;
            color:#fff;
            font-weight:700;
            background:var(--gradient);
        }

        .metrics-grid{
            display:grid;
            grid-template-columns:repeat(4,minmax(0,1fr));
            gap:18px;
            margin-bottom:20px;
        }

        .metric-card{
            padding:22px;
            background:var(--surface-soft);
            border-radius:24px;
            border:1px solid rgba(255,255,255,0.75);
            box-shadow:var(--shadow);
        }

        .metric-card .icon-box{
            width:52px;
            height:52px;
            border-radius:18px;
            display:grid;
            place-items:center;
            background:rgba(37,99,235,0.10);
            color:var(--primary);
            margin-bottom:18px;
        }

        .metric-card h3{
            margin:0;
            font-size:1.9rem;
        }

        .metric-card p{
            margin:8px 0 0;
            color:var(--muted);
        }

        .dashboard-grid{
            display:grid;
            grid-template-columns:1.2fr 0.8fr;
            gap:18px;
            margin-bottom:18px;
        }

        .panel{
            padding:24px;
            background:var(--surface-soft);
            border-radius:24px;
            border:1px solid rgba(255,255,255,0.75);
            box-shadow:var(--shadow);
        }

        .panel-head{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            flex-wrap:wrap;
            margin-bottom:18px;
        }

        .doc-list{
            display:grid;
            gap:14px;
        }

        .doc-item{
            display:grid;
            grid-template-columns:auto 1fr auto;
            gap:14px;
            align-items:start;
            padding:16px;
            border-radius:18px;
            background:rgba(248,250,252,0.95);
            border:1px solid rgba(148,163,184,0.12);
        }

        .doc-icon{
            width:46px;
            height:46px;
            border-radius:16px;
            display:grid;
            place-items:center;
            background:rgba(124,58,237,0.10);
            color:var(--secondary);
        }

        .doc-meta h4{
            margin:0 0 6px;
            font-size:1rem;
        }

        .doc-meta p{
            margin:0;
            color:var(--muted);
            font-size:0.92rem;
            line-height:1.6;
        }

        .tag{
            display:inline-flex;
            align-items:center;
            padding:8px 12px;
            border-radius:999px;
            font-size:0.84rem;
            font-weight:700;
            background:rgba(22,163,74,0.10);
            color:var(--success);
        }

        .summary-box{
            border-radius:20px;
            padding:18px;
            background:linear-gradient(180deg, rgba(37,99,235,0.06), rgba(124,58,237,0.05));
            border:1px solid rgba(37,99,235,0.08);
        }

        .quick-actions{
            display:grid;
            gap:12px;
        }

        .quick-action{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            padding:16px 18px;
            border-radius:18px;
            background:rgba(37,99,235,0.06);
            border:1px solid rgba(37,99,235,0.08);
            transition:0.25s ease;
        }

        .quick-action:hover{
            transform:translateY(-2px);
            background:rgba(37,99,235,0.10);
        }

        .upload-page,
        .result-page{
            width:min(1200px, calc(100% - 32px));
            margin:0 auto;
            padding:24px 0 40px;
        }

        .page-top{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:16px;
            flex-wrap:wrap;
            margin-bottom:22px;
        }

        .page-title{
            margin:0 0 8px;
            font-size:2rem;
            letter-spacing:-0.02em;
        }

        .page-subtitle{
            margin:0;
            color:var(--muted);
            line-height:1.7;
        }

        .upload-grid,
        .result-grid{
            display:grid;
            grid-template-columns:1.08fr 0.92fr;
            gap:20px;
        }

        .upload-card,
        .result-card{
            padding:24px;
            background:var(--surface-soft);
            border-radius:24px;
            border:1px solid rgba(255,255,255,0.75);
            box-shadow:var(--shadow);
        }

        .drop-zone{
            position:relative;
            border:2px dashed rgba(37,99,235,0.22);
            border-radius:24px;
            padding:34px 24px;
            text-align:center;
            background:linear-gradient(180deg, rgba(37,99,235,0.05), rgba(124,58,237,0.04));
            transition:0.25s ease;
        }

        .drop-zone:hover{
            border-color:rgba(37,99,235,0.42);
            background:linear-gradient(180deg, rgba(37,99,235,0.08), rgba(124,58,237,0.06));
        }

        .drop-zone input[type="file"]{
            position:absolute;
            inset:0;
            opacity:0;
            cursor:pointer;
        }

        .upload-icon{
            width:78px;
            height:78px;
            border-radius:24px;
            display:grid;
            place-items:center;
            margin:0 auto 16px;
            background:#fff;
            color:var(--primary);
            box-shadow:var(--shadow-soft);
            font-size:1.6rem;
        }

        .field-grid{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:16px;
        }

        .option-stack{
            display:grid;
            gap:12px;
        }

        .option-row,
        .preview-card,
        .info-item,
        .audio-box{
            padding:16px;
            border-radius:18px;
            background:rgba(248,250,252,0.95);
            border:1px solid rgba(148,163,184,0.14);
        }

        .option-row{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
        }

        .switch{
            width:52px;
            height:30px;
            border-radius:999px;
            background:#dbeafe;
            position:relative;
            display:inline-block;
        }

        .switch::after{
            content:"";
            position:absolute;
            top:4px;
            left:4px;
            width:22px;
            height:22px;
            border-radius:50%;
            background:#fff;
            box-shadow:0 4px 10px rgba(15,23,42,0.12);
        }

        .switch.active{
            background:var(--gradient);
        }

        .switch.active::after{
            left:26px;
        }

        .progress-wrap{
            display:grid;
            gap:10px;
        }

        .progress-bar{
            width:100%;
            height:12px;
            background:#e5e7eb;
            border-radius:999px;
            overflow:hidden;
        }

        .progress-bar span{
            display:block;
            width:72%;
            height:100%;
            background:var(--gradient);
            border-radius:inherit;
        }

        .success-badge{
            width:90px;
            height:90px;
            margin:0 auto 18px;
            border-radius:28px;
            display:grid;
            place-items:center;
            font-size:2rem;
            color:var(--success);
            background:linear-gradient(135deg, rgba(22,163,74,0.15), rgba(37,99,235,0.10));
            box-shadow:var(--shadow-soft);
        }

        .action-grid{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:12px;
            margin-top:16px;
        }

        .info-list{
            display:grid;
            gap:12px;
        }

        .small-label{
            font-size:0.82rem;
            text-transform:uppercase;
            letter-spacing:0.1em;
            color:#94a3b8;
            font-weight:700;
            margin-bottom:8px;
        }

        audio{
            width:100%;
            margin-top:10px;
        }

        .preview-area{
            padding:18px;
            border-radius:20px;
            background:linear-gradient(180deg, rgba(37,99,235,0.04), rgba(124,58,237,0.04));
            border:1px solid rgba(37,99,235,0.08);
        }

        .empty-state{
            padding:22px;
            border-radius:18px;
            text-align:center;
            color:var(--muted);
            background:rgba(248,250,252,0.95);
            border:1px dashed rgba(148,163,184,0.22);
        }

        @media (max-width:1180px){
            .auth-layout,
            .upload-grid,
            .result-grid,
            .dashboard-grid{
                grid-template-columns:1fr;
            }

            .dashboard-shell{
                grid-template-columns:1fr;
            }

            .sidebar{
                display:none;
            }

            .metrics-grid{
                grid-template-columns:repeat(2,minmax(0,1fr));
            }

            .hero-panel{
                min-height:auto;
            }
        }

        @media (max-width:720px){
            .container,
            .upload-page,
            .result-page{
                width:min(100%, calc(100% - 20px));
            }

            .hero-panel,
            .form-panel,
            .panel,
            .upload-card,
            .result-card,
            .metric-card{
                padding:20px;
                border-radius:22px;
            }

            .feature-grid,
            .field-grid,
            .metrics-grid,
            .social-grid,
            .action-grid{
                grid-template-columns:1fr;
            }

            .illus-grid{
                grid-template-columns:1fr;
            }

            .doc-item{
                grid-template-columns:1fr;
            }

            .page-title,
            .form-title{
                font-size:1.7rem;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}

    {% block extra_js %}{% endblock %}
</body>
</html>
