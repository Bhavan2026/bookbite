<!DOCTYPE html>
<html>
<head>
<title>Audio Library</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<style>

body{
    font-family:'Poppins', sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
}

/* CONTAINER */
.container{
    padding:40px;
}

/* CARD */
.card{
    padding:20px;
    border-radius:15px;
    background:rgba(255,255,255,0.05);
    margin-bottom:20px;
}

/* AUDIO */
audio{
    width:100%;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>🎧 Audio Library</h1>

{% for audio in audio_list %}
<div class="card">

<h3>{{ audio.title }}</h3>

<p>🔊 English Audio</p>
<audio controls>
    <source src="{{ audio.english_audio }}" type="audio/mp3">
</audio>

<p>🌐 Translated Audio</p>
<audio controls>
    <source src="{{ audio.translated_audio }}" type="audio/mp3">
</audio>

</div>
{% endfor %}

</div>

</body>
</html>
