<!DOCTYPE html>

<html>

<head>

<title>Chat with Document</title>

<style>

body{
font-family: Arial;
background:#f2f2f2;
margin:40px;
}

.container{
background:white;
padding:30px;
border-radius:10px;
box-shadow:0px 0px 10px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<div class="container">

<h1>Chat with Document</h1>

<a href="/">Upload</a> |
<a href="/dashboard/">Dashboard</a> |
<a href="/logout/">Logout</a>

<hr>

<form method="POST">

{% csrf_token %}

<input type="text" name="question" placeholder="Ask something about the document" style="width:70%">

<button type="submit">Ask</button>

</form>

<hr>

{% if response %}

<h3>Answer</h3>

<p>{{ response }}</p>

{% endif %}

</div>

</body>

</html>
