{% extends "base.html" %}
{% block content %}

<style>

/* PAGE */
body {
    background: #0f172a;
    font-family: 'Poppins', sans-serif;
    margin:0;
}

/* MAIN LAYOUT */
.upload-page {
    display:flex;
    height:100vh;
}

/* LEFT PANEL (AI VISUAL) */
.left-panel {
    flex:1;
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    padding:40px;
    overflow:hidden;
}

/* GLOW BLOBS */
.blob {
    position:absolute;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(120px);
    opacity:0.6;
}

.blob1 { background:#7c3aed; top:10%; left:10%; }
.blob2 { background:#2563eb; bottom:10%; right:10%; }

/* TEXT */
.left-panel h1 {
    font-size:40px;
    z-index:1;
}

.left-panel p {
    opacity:0.7;
    z-index:1;
}

/* RIGHT PANEL */
.right-panel {
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* CARD */
.upload-card {
    width:420px;
    padding:40px;
    border-radius:20px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    box-shadow:0 0 40px rgba(124,58,237,0.3);
    color:white;
}

/* DROP ZONE */
.drop-zone {
    border:2px dashed rgba(255,255,255,0.2);
    padding:50px;
    text-align:center;
    border-radius:16px;
    cursor:pointer;
    transition:0.3s;
}

.drop-zone:hover {
    border-color:#7c3aed;
    background:rgba(124,58,237,0.08);
    transform:scale(1.02);
}

/* INPUT */
input, select {
    width:100%;
    padding:12px;
    margin-top:15px;
    border-radius:10px;
    border:none;
    outline:none;
}

/* BUTTON */
.btn {
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover {
    box-shadow:0 0 25px #7c3aed;
}

/* STEPS */
.steps {
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
    font-size:14px;
    opacity:0.7;
}

.upload-wrapper {
    width:100%;
    max-width:500px;
    color:white;
}

.upload-wrapper h2 {
    font-size:32px;
    margin-bottom:5px;
}

.upload-wrapper p {
    opacity:0.6;
    margin-bottom:30px;
}

/* UPLOAD AREA */
.upload-area {
    display:flex;
    justify-content:center;
    align-items:center;
    height:160px;
    border:2px dashed rgba(255,255,255,0.2);
    border-radius:15px;
    text-align:center;
    cursor:pointer;
    transition:0.3s;
}

.upload-area:hover {
    border-color:#7c3aed;
    background:rgba(124,58,237,0.08);
}

.upload-area span {
    font-size:12px;
    opacity:0.5;
}

/* INPUT ROW */
.inputs-row {
    display:flex;
    gap:10px;
    margin-top:20px;
}

.inputs-row input,
.inputs-row select {
    flex:1;
    padding:12px;
    border-radius:10px;
    border:none;
    outline:none;
}

/* BUTTON */
.btn-main {
    width:100%;
    margin-top:25px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn-main:hover {
    box-shadow:0 0 25px #7c3aed;
    transform:translateY(-2px);
}

</style>

<div class="upload-page">

<!-- LEFT SIDE -->
<div class="left-panel">

    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <h1>📘 Bookbite AI</h1>
    <p>Upload → AI Analysis → Smart Output</p>

    <div style="margin-top:40px; z-index:1;">
        <p>⚡ Summarization</p>
        <p>🌐 Translation</p>
        <p>🔊 Text to Speech</p>
    </div>

</div>

<!-- RIGHT SIDE -->

<div class="right-panel">

    <div class="upload-wrapper">

        <h2>🚀 Process Your Document</h2>
        <p>Upload your PDF and get instant AI insights</p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- BIG UPLOAD AREA -->
            <label class="upload-area">
                <div id="file-text">
                    📄 Drop your PDF here<br>
                    <span>or click to browse</span>
                </div>
                <input type="file" name="file" accept=".pdf" hidden required>
            </label>

            <!-- INLINE INPUTS -->
            <div class="inputs-row">
                <input type="text" name="title" placeholder="Document title..." required>

                <select name="language">
                    <option value="en">English</option>
                    <option value="ta">Tamil</option>
                    <option value="hi">Hindi</option>
                    <option value="te">Telugu</option>
                    <option value="kn">Kannada</option>
                    <option value="ml">Malayalam</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="es">Spanish</option>
                    <option value="it">Italian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="zh-cn">Chinese</option>
                    <option value="ar">Arabic</option>
                    <option value="ru">Russian</option>
                </select>
            </div>

            <!-- BUTTON -->
            <button class="btn-main">
                ⚡ Generate AI Output
            </button>

        </form>

    </div>

</div>

</div>

</div>

<script>
document.querySelector("input[type=file]").addEventListener("change", function(){
    document.getElementById("file-text").innerHTML =
        "✅ " + this.files[0].name;
});
</script>

{% endblock %}
